apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coral
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RKruit/k3s-gitops
    targetRevision: main
    path: base/coral
  destination:
    server: https://kubernetes.default.svc
    namespace: coral
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: networking.k8s.io
      jsonPointers:
        - /status/loadBalancer
      kind: Ingress
