apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sv02-victoria-metrics
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RKruit/k3s-gitops
    targetRevision: main
    path: base/monitoring/victoria-metrics
  destination:
    server: https://192.168.1.3:6443
    namespace: monitoring
  ignoreDifferences:
    - group: networking.k8s.io
      jsonPointers:
        - /status/loadBalancer
      kind: Ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true