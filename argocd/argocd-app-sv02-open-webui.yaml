apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sv02-open-webui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: open-webui
    repoURL: https://helm.openwebui.com/
    targetRevision: 14.5.0
    helm:
      releaseName: open-webui
      values: |
        ollama:
          enabled: false
        ollamaUrls:
          - http://192.168.1.10:11434
        pipelines:
          enabled: false
        websocket:
          enabled: false
        persistence:
          enabled: true
          size: 2Gi
          storageClass: nfs
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        ingress:
          enabled: true
          class: traefik
          host: webui.oostrandpark.com
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
          tls: true
          existingSecret: open-webui-tls
        extraResources:
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: open-webui-tls
              namespace: open-webui
            spec:
              dnsNames:
                - webui.oostrandpark.com
              issuerRef:
                kind: ClusterIssuer
                name: letsencrypt-prod
              secretName: open-webui-tls
  destination:
    server: https://192.168.1.3:6443
    namespace: open-webui
  ignoreDifferences:
    - group: networking.k8s.io
      jsonPointers:
        - /status/loadBalancer
      kind: Ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
