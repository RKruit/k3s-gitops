apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sv02-kube-state-metrics
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RKruit/talos-gitops
    targetRevision: main
    path: base/monitoring/kube-state-metrics
  destination:
    server: https://192.168.1.3:6443
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true