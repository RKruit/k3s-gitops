services:
  caddy:
    build: .
    image: sv01-caddy-dns
    container_name: sv01-caddy
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # hele map mounten (niet het losse bestand): inode-swaps door atomair
      # wegschrijven blijven dan zichtbaar in de container
      - .:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  todo-app:
    image: ghcr.io/rkruit/todo-app:latest
    container_name: sv01-todo-app
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - todo-data:/data

  # --- Komodo (ArgoCD-vervanger) — mongo local i.v.m. wiredTiger-on-NFS-risico ---
  mongo:
    image: mongo:9.0
    container_name: sv01-komodo-mongo
    labels:
      komodo.skip:
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    container_name: sv01-komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      - mongo
    labels:
      komodo.skip:
    env_file: /etc/komodo/sv01-secrets/sv01.env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    volumes:
      - komodo-keys:/config/keys
      - /srv/komodo-backups:/backups
      - komodo-repo-cache:/repo-cache

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    container_name: sv01-komodo-periphery
    init: true
    restart: unless-stopped
    depends_on:
      - core
    labels:
      komodo.skip:
    env_file: /etc/komodo/sv01-secrets/sv01.env
    environment:
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_PRIVATE_KEY: file:/config/keys/periphery.key
      PERIPHERY_CONNECT_AS: Local
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - komodo-keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
      # sync-timer stack zichtbaar voor Komodo-stacks (read-only)
      - /opt/sv01-config:/etc/komodo/sv01-config:ro
      # env-file voor Komodo-stack deploys (zelfde file als --env-file van de timer)
      - /srv/sv01-secrets:/etc/komodo/sv01-secrets:ro
      # ghcr.io-credentials voor auto-update checks op de privé todo-image
      - /etc/komodo/periphery.config.toml:/config/config.toml:ro
      # docker login van rkruit → compose pull authenticeert tegen ghcr (privé todo-image)
      - /home/rkruit/.docker:/root/.docker:ro

  # --- Hermes-agent (Telegram-bots voor externe gebruikers) ---
  # Volledig geïsoleerd: geen host-mounts behalve de NFS-datadir, geen docker-socket,
  # geen gepubliceerde poorten. Hermes draait op het interne netwerk (geen default
  # route); al het egress verloopt via de squid-allowlist (api.telegram.org).
  # LLM-verkeer gaat rechtstreeks naar host-Ollama via de bridge-gateway (172.28.0.1).
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: sv01-hermes
    restart: unless-stopped
    # bewust niet in de dagelijkse image-update: update = handmatig volgens
    # services/hermes.md (diun meldt wel wanneer er een nieuwe stable is)
    pull_policy: never
    labels:
      diun.enable: "true"
    depends_on:
      - egress-proxy
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,172.28.0.1
      no_proxy: localhost,127.0.0.1,172.28.0.1
    volumes:
      - hermes-data:/opt/data
    networks:
      - hermes-internal
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: sv01-hermes-egress
    restart: unless-stopped
    pull_policy: never # behoort bij hermes: geen auto-updates
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - hermes-internal
      - hermes-egress

  # --- Monitoring (2026-10-24): Uptime Kuma (health-checks + Telegram alerts) ---
  # host-net: kan ook loopback-only diensten (hindsight :9177, postgres :5432)
  # rechtstreeks monitoren. UI: :3001 en via Caddy (kuma.oostrandpark.com).
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: sv01-uptime-kuma
    restart: unless-stopped
    network_mode: host
    labels:
      autoheal: "true"
      diun.enable: "true"
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - kuma-data:/app/data

  # --- Monitoring: Beszel hub (host/container-metrics) ---
  # UI via Caddy (beszel.oostrandpark.com); admin-API alleen op host-loopback.
  beszel:
    image: henrygd/beszel:latest
    container_name: sv01-beszel
    restart: unless-stopped
    labels:
      diun.enable: "true"
    environment:
      APP_URL: https://beszel.oostrandpark.com
    ports:
      - "127.0.0.1:8090:8090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket

  # agent voor sv01 zelf (unix-socket mode volgens beszel-docs)
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: sv01-beszel-agent
    restart: unless-stopped
    network_mode: host
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - beszel-socket:/beszel_socket
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${BESZEL_TOKEN:-}
      KEY: ${BESZEL_KEY:-}
      PORT: 45876

  # --- Docs: MkDocs Material (bouwt /docs van deze repo live) ---
  # inotify over de bind-mount: de sync-timer's git pull op /opt/sv01-config
  # triggert een rebuild; Caddy routeert docs.oostrandpark.com (geen published port).
  docs:
    image: ghcr.io/squidfunk/mkdocs-material:9
    container_name: sv01-docs
    restart: unless-stopped
    command: ["serve", "--dev-addr", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"
      diun.enable: "true"
    volumes:
      - /opt/sv01-config:/docs:ro

  # --- Homepage (2026-10-26): dashboard met alle interne links ---
  # config uit de repo (sv01/compose/homepage), docker.sock ro voor status-dots,
  # geen published port: Caddy routeert homepage.oostrandpark.com -> homepage:3000
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: sv01-homepage
    restart: unless-stopped
    labels:
      autoheal: "true"
      diun.enable: "true"
    environment:
      TZ: Europe/Amsterdam
      HOMEPAGE_ALLOWED_HOSTS: homepage.oostrandpark.com
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- IT-Tools (2026-10-26, bestond al in de k3s-tijd; na compose-migratie opnieuw op-
  # gezet): dev/web tools. Stateless — geen volume. Caddy: tools.oostrandpark.com.
  it-tools:
    image: corentinth/it-tools:latest
    container_name: sv01-it-tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 3 http://127.0.0.1:80/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      autoheal: "true"
      diun.enable: "true"

  # --- GitHub push-deploy (2026-10-27): Cloudflare Tunnel-connector ---
  # Connector voor CF-tunnel 'sv01-hooks': routet GitHub-webhook-POST's naar de
  # host-side receiver (systemd gh-webhook.service, 127.0.0.1:9100) die de
  # sv01-config-sync-unit restart. host-net zodat cloudflared localhost:9100
  # bereikt; verder alleen UITgaande verbindingen, geen published ports.
  # Ingress = LOKAAL uit de repo (de CF-wizard wilde geen routes op een
  # niet-Healthy tunnel): sv01/compose/cloudflared/config.yaml.
  # TunnelSecret in /srv/sv01-secrets/cloudflared-creds.json (ro). user=0 nodig:
  # image draait non-root en mag 640-creds anders niet lezen.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    container_name: sv01-cloudflared
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yaml", "run"]
    volumes:
      - ./cloudflared/config.yaml:/etc/cloudflared/config.yaml:ro
      - /srv/sv01-secrets/cloudflared-creds.json:/etc/cloudflared/creds.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Container-upkeep (2026-10-27): watchdogs + dagelijkse image-update ---
  # autoheal: herstart containers met label autoheal=true die unhealthy zijn.
  # diun: meldt nieuwe image-tags op Telegram (opt-in via label diun.enable).
  # De dagelijkse pull is host-side: sv01-image-update.timer (excl. hermes/
  # egress-proxy/caddy — zie sv01/scripts/image-update.sh + docspage).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: sv01-autoheal
    restart: unless-stopped
    labels:
      diun.enable: "true"
    environment:
      AUTOHEAL_INTERVAL: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  diun:
    image: crazymax/diun:4
    container_name: sv01-diun
    restart: unless-stopped
    command: ["serve", "--config", "/etc/diun/diun.yml"]
    env_file: /srv/sv01-secrets/diun.env
    labels:
      diun.enable: "true"
    volumes:
      - ./diun/diun.yml:/etc/diun/diun.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - diun-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
  komodo-keys:
  komodo-repo-cache:
  komodo-mongo-data:
  komodo-mongo-config:
  todo-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      # zelfde NFS-map als de oude k3s PVC — data gaat naadloos mee
      device: ":/volume1/k8sv2/todo-app-todo-app-data-pvc-f673b41b-3742-45ab-81b1-aa8cf6c73588"

  hermes-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/hermes-data"

  beszel-agent-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/beszel-agent-data"

  kuma-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/kuma-data"

  beszel-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/beszel-data"

  # diun-cache (digest-state) — regenereerbaar, maar volgens conventie op NFS
  diun-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/diun-data"

  # socket tussen beszel-hub en agent — NIET op NFS (unix socket)
  beszel-socket:

networks:
  # interne netwerk: geen default route, geen internet, geen LAN
  hermes-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # alleen de squid-proxy hangt hier aan (heeft internet nodig)
  hermes-egress:
    ipam:
      config:
        - subnet: 172.29.0.0/24