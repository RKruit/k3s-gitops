services:
  caddy:
    build: .
    image: sv01-caddy-dns
    container_name: sv01-caddy
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # hele map mounten (niet het losse bestand): inode-swaps door atomair
      # wegschrijven blijven dan zichtbaar in de container
      - .:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  todo-app:
    image: ghcr.io/rkruit/todo-app:latest
    container_name: sv01-todo-app
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - todo-data:/data

  # --- Komodo (ArgoCD-vervanger) — mongo local i.v.m. wiredTiger-on-NFS-risico ---
  mongo:
    image: mongo:9.0
    container_name: sv01-komodo-mongo
    labels:
      komodo.skip:
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    container_name: sv01-komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      - mongo
    labels:
      komodo.skip:
    env_file: /etc/komodo/sv01-secrets/sv01.env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    volumes:
      - komodo-keys:/config/keys
      - /srv/komodo-backups:/backups
      - komodo-repo-cache:/repo-cache

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    container_name: sv01-komodo-periphery
    init: true
    restart: unless-stopped
    depends_on:
      - core
    labels:
      komodo.skip:
    env_file: /etc/komodo/sv01-secrets/sv01.env
    environment:
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_PRIVATE_KEY: file:/config/keys/periphery.key
      PERIPHERY_CONNECT_AS: Local
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - komodo-keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
      # sync-timer stack zichtbaar voor Komodo-stacks (read-only)
      - /opt/sv01-config:/etc/komodo/sv01-config:ro
      # env-file voor Komodo-stack deploys (zelfde file als --env-file van de timer)
      - /srv/sv01-secrets:/etc/komodo/sv01-secrets:ro
      # ghcr.io-credentials voor auto-update checks op de privé todo-image
      - /etc/komodo/periphery.config.toml:/config/config.toml:ro
      # docker login van rkruit → compose pull authenticeert tegen ghcr (privé todo-image)
      - /home/rkruit/.docker:/root/.docker:ro

  # --- Hermes-agent (Telegram-bots voor externe gebruikers) ---
  # Volledig geïsoleerd: geen host-mounts behalve de NFS-datadir, geen docker-socket,
  # geen gepubliceerde poorten. Hermes draait op het interne netwerk (geen default
  # route); al het egress verloopt via de squid-allowlist (api.telegram.org).
  # LLM-verkeer gaat rechtstreeks naar host-Ollama via de bridge-gateway (172.28.0.1).
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: sv01-hermes
    restart: unless-stopped
    depends_on:
      - egress-proxy
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,172.28.0.1
      no_proxy: localhost,127.0.0.1,172.28.0.1
    volumes:
      - hermes-data:/opt/data
    networks:
      - hermes-internal
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: sv01-hermes-egress
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - hermes-internal
      - hermes-egress

  # --- Monitoring (2026-10-24): Uptime Kuma (health-checks + Telegram alerts) ---
  # host-net: kan ook loopback-only diensten (hindsight :9177, postgres :5432)
  # rechtstreeks monitoren. UI: :3001 en via Caddy (kuma.oostrandpark.com).
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: sv01-uptime-kuma
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - kuma-data:/app/data

  # --- Monitoring: Beszel hub (host/container-metrics) ---
  # UI via Caddy (beszel.oostrandpark.com); admin-API alleen op host-loopback.
  beszel:
    image: henrygd/beszel:latest
    container_name: sv01-beszel
    restart: unless-stopped
    environment:
      APP_URL: https://beszel.oostrandpark.com
    ports:
      - "127.0.0.1:8090:8090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket

  # agent voor sv01 zelf (unix-socket mode volgens beszel-docs)
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: sv01-beszel-agent
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - beszel-socket:/beszel_socket
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${BESZEL_TOKEN:-}
      KEY: ${BESZEL_KEY:-}
      PORT: 45876

volumes:
  caddy-data:
  caddy-config:
  komodo-keys:
  komodo-repo-cache:
  komodo-mongo-data:
  komodo-mongo-config:
  todo-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      # zelfde NFS-map als de oude k3s PVC — data gaat naadloos mee
      device: ":/volume1/k8sv2/todo-app-todo-app-data-pvc-f673b41b-3742-45ab-81b1-aa8cf6c73588"

  hermes-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/hermes-data"

  beszel-agent-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/beszel-agent-data"

  kuma-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/kuma-data"

  beszel-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/beszel-data"

  # socket tussen beszel-hub en agent — NIET op NFS (unix socket)
  beszel-socket:

networks:
  # interne netwerk: geen default route, geen internet, geen LAN
  hermes-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # alleen de squid-proxy hangt hier aan (heeft internet nodig)
  hermes-egress:
    ipam:
      config:
        - subnet: 172.29.0.0/24