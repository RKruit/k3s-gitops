services:
  caddy:
    build: .
    image: sv01-caddy-dns
    container_name: sv01-caddy
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # hele map mounten (niet het losse bestand): inode-swaps door atomair
      # wegschrijven blijven dan zichtbaar in de container
      - .:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  # --- Authelia (2026-10-28): SSO-provider — 1 account (rkruit), wachtwoord-login ---
  # Beschermt alle UI-routes via Caddy-forward_auth (snippet in Caddyfile);
  # login-portal: auth.oostrandpark.com. LAN-poort :9091 = ook voor de fase-2
  # sv02-Caddy-integratie (Frigate). Secrets: AUTHELIA_* uit
  # /srv/sv01-secrets/authelia.env. SQLite op lokaal volume (NFS = corruptie-
  # risico, zoals mongo); sessions in-memory → restart sv01-authelia =
  # opnieuw inloggen.
  authelia:
    image: authelia/authelia:4.39.28
    container_name: sv01-authelia
    restart: unless-stopped
    labels:
      diun.enable: "true"
    env_file: /srv/sv01-secrets/authelia.env
    # Tweede config-bestand = OIDC-provider-blok (jwks + clients), buiten git:
    # /srv/sv01-secrets/authelia-oidc.yml (conventie: secrets niet in de repo)
    command: ["--config", "/config/configuration.yml", "--config", "/config/authelia-oidc.yml"]
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - /srv/sv01-secrets/authelia-oidc.yml:/config/authelia-oidc.yml:ro
      - authelia-data:/config
    ports:
      - '192.168.1.10:9091:9091'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  todo-app:
    image: ghcr.io/rkruit/todo-app:latest
    container_name: sv01-todo-app
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - todo-data:/data

  # --- Komodo (ArgoCD-vervanger) — mongo local i.v.m. wiredTiger-on-NFS-risico ---
  mongo:
    image: mongo:9.0
    container_name: sv01-komodo-mongo
    # uid 999 = image's `mongodb` user; db files are already 999-owned.
    # Started as non-root the official entrypoint skips its `gosu` branch —
    # that step spins (sched_yield, 100% CPU, mongod never boots) under the
    # docker-default AppArmor profile since the 2026-10-30 upgrade
    # (apparmor 5.0.2 / kernel 7.0.0 / runc 1.4.0 + reboot).
    user: "999:999"
    labels:
      komodo.skip:
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    container_name: sv01-komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      - mongo
    labels:
      komodo.skip:
    env_file: /etc/komodo/sv01-secrets/sv01.env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    volumes:
      - komodo-keys:/config/keys
      - /srv/komodo-backups:/backups
      - komodo-repo-cache:/repo-cache

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    container_name: sv01-komodo-periphery
    init: true
    restart: unless-stopped
    depends_on:
      - core
    labels:
      komodo.skip:
    env_file: /etc/komodo/sv01-secrets/sv01.env
    environment:
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_PRIVATE_KEY: file:/config/keys/periphery.key
      PERIPHERY_CONNECT_AS: Local
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - komodo-keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
      # sync-timer stack zichtbaar voor Komodo-stacks (read-only)
      - /opt/sv01-config:/etc/komodo/sv01-config:ro
      # env-file voor Komodo-stack deploys (zelfde file als --env-file van de timer)
      - /srv/sv01-secrets:/etc/komodo/sv01-secrets:ro
      # ghcr.io-credentials voor auto-update checks op de privé todo-image
      - /etc/komodo/periphery.config.toml:/config/config.toml:ro
      # docker login van rkruit → compose pull authenticeert tegen ghcr (privé todo-image)
      - /home/rkruit/.docker:/root/.docker:ro

  # --- Hermes-agent (Telegram-bots voor externe gebruikers) ---
  # Volledig geïsoleerd: geen host-mounts behalve de NFS-datadir, geen docker-socket,
  # geen gepubliceerde poorten. Hermes draait op het interne netwerk (geen default
  # route); al het egress verloopt via de squid-allowlist (api.telegram.org).
  # LLM-verkeer gaat rechtstreeks naar host-Ollama via de bridge-gateway (172.28.0.1).
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: sv01-hermes
    restart: unless-stopped
    # bewust niet in de dagelijkse image-update: update = handmatig volgens
    # services/hermes.md (diun meldt wel wanneer er een nieuwe stable is)
    pull_policy: never
    labels:
      diun.enable: "true"
    depends_on:
      - egress-proxy
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,172.28.0.1
      no_proxy: localhost,127.0.0.1,172.28.0.1
    volumes:
      - hermes-data:/opt/data
    networks:
      - hermes-internal
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: sv01-hermes-egress
    restart: unless-stopped
    pull_policy: never # behoort bij hermes: geen auto-updates
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - hermes-internal
      - hermes-egress

  # --- Monitoring (2026-10-24): Uptime Kuma (health-checks + Telegram alerts) ---
  # host-net: kan ook loopback-only diensten (hindsight :9177, postgres :5432)
  # rechtstreeks monitoren. UI: :3001 en via Caddy (kuma.oostrandpark.com).
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: sv01-uptime-kuma
    restart: unless-stopped
    network_mode: host
    labels:
      autoheal: "true"
      diun.enable: "true"
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - kuma-data:/app/data

  # --- Monitoring: Beszel hub (host/container-metrics) ---
  # UI via Caddy (beszel.oostrandpark.com); admin-API alleen op host-loopback.
  beszel:
    image: henrygd/beszel:latest
    container_name: sv01-beszel
    restart: unless-stopped
    labels:
      diun.enable: "true"
    environment:
      APP_URL: https://beszel.oostrandpark.com
    ports:
      - "127.0.0.1:8090:8090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket

  # agent voor sv01 zelf (unix-socket mode volgens beszel-docs)
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: sv01-beszel-agent
    restart: unless-stopped
    network_mode: host
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - beszel-socket:/beszel_socket
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${BESZEL_TOKEN:-}
      KEY: ${BESZEL_KEY:-}
      PORT: 45876

  # --- Docs: MkDocs Material (bouwt /docs van deze repo live) ---
  # inotify over de bind-mount: de sync-timer's git pull op /opt/sv01-config
  # triggert een rebuild; Caddy routeert docs.oostrandpark.com (geen published port).
  docs:
    image: ghcr.io/squidfunk/mkdocs-material:9
    container_name: sv01-docs
    restart: unless-stopped
    command: ["serve", "--dev-addr", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"
      diun.enable: "true"
    volumes:
      - /opt/sv01-config:/docs:ro

  # --- Homepage (2026-10-26): dashboard met alle interne links ---
  # config uit de repo (sv01/compose/homepage), docker.sock ro voor status-dots,
  # geen published port: Caddy routeert homepage.oostrandpark.com -> homepage:3000
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: sv01-homepage
    restart: unless-stopped
    labels:
      autoheal: "true"
      diun.enable: "true"
    environment:
      TZ: Europe/Amsterdam
      HOMEPAGE_ALLOWED_HOSTS: homepage.oostrandpark.com
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- IT-Tools (2026-10-26, bestond al in de k3s-tijd; na compose-migratie opnieuw op-
  # gezet): dev/web tools. Stateless — geen volume. Caddy: tools.oostrandpark.com.
  it-tools:
    image: corentinth/it-tools:latest
    container_name: sv01-it-tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 3 http://127.0.0.1:80/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      autoheal: "true"
      diun.enable: "true"

  # --- GitHub push-deploy (2026-10-27): Cloudflare Tunnel-connector ---
  # Connector voor CF-tunnel 'sv01-hooks': routet GitHub-webhook-POST's naar de
  # host-side receiver (systemd gh-webhook.service, 127.0.0.1:9100) die de
  # sv01-config-sync-unit restart. host-net zodat cloudflared localhost:9100
  # bereikt; verder alleen UITgaande verbindingen, geen published ports.
  # Ingress = LOKAAL uit de repo (de CF-wizard wilde geen routes op een
  # niet-Healthy tunnel): sv01/compose/cloudflared/config.yaml.
  # TunnelSecret in /srv/sv01-secrets/cloudflared-creds.json (ro). user=0 nodig:
  # image draait non-root en mag 640-creds anders niet lezen.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    container_name: sv01-cloudflared
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yaml", "run"]
    volumes:
      - ./cloudflared/config.yaml:/etc/cloudflared/config.yaml:ro
      - /srv/sv01-secrets/cloudflared-creds.json:/etc/cloudflared/creds.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- WhatsApp-bridge (2026-10-29): WAHA core (devlikeapro) — dagrapport-bot ---
  # Stuurt dagelijks de homelab-status naar Robert's WhatsApp (cronjob 07:00 →
  # ~/whatsapp/daily-report.py → POST /api/sendText). NOWEB-engine (Baileys,
  # licht image zonder chrome). Sessies persistent op NFS (één QR-scan).
  # API/dashboard alléén op host-loopback :3000 — bewust géén Caddy-route
  # (niet publiek). Creds + chat-target: /srv/sv01-secrets/waha.env.
  waha:
    image: devlikeapro/waha:latest
    container_name: sv01-waha
    restart: unless-stopped
    labels:
      autoheal: "true"
      diun.enable: "true"
    env_file: /srv/sv01-secrets/waha.env
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_START_SESSION: default
      WHATSAPP_RESTART_SESSION: "true"
      WAHA_PRINT_QR: "false"
      TZ: Europe/Amsterdam
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - waha-data:/app/.sessions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- MQTT-broker: Mosquitto draait bewust ALS HOST-SERVICE (geen container):
  # Ubuntu-apparmor confineert het mosquitto-binary tot /etc/mosquitto +
  # /var/lib/mosquitto, container-varianten krijgen 'Unable to open config file'.
  # Zie sv01/mosquitto/README.md + docs/services/mosquitto.md; systemd-unit
  # mosquitto.service (apt-pakket), config in /etc/mosquitto/conf.d/00-sv01.conf.

  # --- Container-upkeep (2026-10-27): watchdogs + dagelijkse image-update ---
  # autoheal: herstart containers met label autoheal=true die unhealthy zijn.
  # diun: meldt nieuwe image-tags op Telegram (opt-in via label diun.enable).
  # De dagelijkse pull is host-side: sv01-image-update.timer (excl. hermes/
  # egress-proxy/caddy — zie sv01/scripts/image-update.sh + docspage).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: sv01-autoheal
    restart: unless-stopped
    labels:
      diun.enable: "true"
    environment:
      AUTOHEAL_INTERVAL: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  diun:
    image: crazymax/diun:4
    container_name: sv01-diun
    restart: unless-stopped
    env_file: /srv/sv01-secrets/diun.env
    environment:
      # docker provider met defaults = opt-in via label diun.enable=true.
      # diun 4.33's strict schema is per-sectie inconsistent in snake/camelCase
      # → we laten het diun.yml-bestand weg en zetten alles via env-vars.
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_WATCH_SCHEDULE: "0 5 * * *" # dagelijks 05:00 — ná de updater van 04:17
    labels:
      diun.enable: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - diun-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Traffmonetizer (2026-11-04): bandwidth-sharing CLI (passive income) ---
  # Untrusted vendor (see docs/services/traffmonetizer.md for the decision
  # context incl. the Nov-2026 XCPE report): deliberately hard sandbox —
  # no caps, NO volumes, NO published ports, tmpfs scratch dirs, default-bridge
  # egress only (all outbound TCP/UDP). Rootfs writable: the distroless image
  # (no shell) writes inside its own dir at startup and the exact path is not
  # mappable; the container stays fully ephemeral + capless, which is the
  # protection that matters here. Token: TRAFFMONETIZER_TOKEN in
  # /srv/sv01-secrets/sv01.env (outside git). Device name "sv01" in dashboard.
  # Auto-update: floating tag via de dagelijkse image-update (Robert 2026-11-04);
  # diun meldt nieuwe tags op Telegram.
  traffmonetizer:
    image: traffmonetizer/cli_v2:latest
    container_name: sv01-traffmonetizer
    restart: unless-stopped
    cap_drop: [ALL]
    labels:
      diun.enable: "true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    command: ["start", "accept", "--token", "${TRAFFMONETIZER_TOKEN}", "--device-name", "sv01"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # --- Pawns.app (2026-11-04): IPRoyal-bandbreedte-delen (passive income) ---
  # Zelfde patroon als traffmonetizer: untrusted vendor → hard sandbox —
  # geen caps, geen volumes, geen ports, tmpfs scratch, limits, diun,
  # daily auto-update (floating :latest). Credentials via compose-interpolatie
  # uit sv01.env (PAWNS_EMAIL / PAWNS_PASSWORD) in de CLI-args; let op: een
  # `$` in het wachtwoord moet verdubbeld ($$) om interpolatie te ontwijken.
  pawns:
    image: iproyal/pawns-cli:latest
    container_name: sv01-pawns
    restart: unless-stopped
    # 2026-11-04: TIJDELIJK UIT (profile disables it) — vendor's SDK login
    # refuses this verified password-account (creds proven valid via the
    # dashboard API; see docspage). Re-enable = delete the profiles line.
    profiles: ["disabled"]
    cap_drop: [ALL]
    labels:
      diun.enable: "true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    command: ["-email=${PAWNS_EMAIL}", "-password=${PAWNS_PASSWORD}", "-device-name=sv01", "-device-id=sv01", "-accept-tos"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- MystNodes (2026-11-04): Mysterium dVPN node — bandwidth sharing (passive income) ---
  # Same untrusted-vendor category as traffmonetizer/pawns BUT this one ACCEPTS
  # inbound sessions (it is a dVPN exit/entry node), so it needs more than the
  # egress-only hard sandbox:
  #   - vendor requires NET_ADMIN (+ /dev/net/tun) to build tun/wg interfaces
  #     inside the container; cap_drop ALL is kept, only the 3 documented caps
  #     (NET_ADMIN, SETUID, SETGID) are re-granted;
  #   - published UDP 61000-61100 = the node's WireGuard listener range
  #     (--wireguard.listen.ports). The DEFAULT range 56000-56100 was rejected
  #     on purpose: it collided with a then-existing OPNsense WAN forward
  #     (udp 10000-60000 -> 192.168.1.3, since deleted 04-11-2026). OPNsense
  #     forwards WAN udp 61000-61100 -> this host (see docs/services/mystnodes.md).
  #   - node UI = plain http :4449, no login: LAN access only
  #     (http://192.168.1.10:4449), deliberately NOT given a Caddy route and
  #     NOT WAN-forwarded.
  # Compensating isolation: own network (no reach to the other sv01
  # containers), no docker socket, single NFS volume for identity/keystore,
  # mem/cpu limits, log rotation. Egress must stay open (broker + sessions).
  myst:
    image: mysteriumnetwork/myst:latest
    container_name: sv01-myst
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
    devices:
      - /dev/net/tun:/dev/net/tun
    # --wireguard.listen.ports = provider WG listener range; MUST match the
    # published UDP range above. 1.39.9 help claims --udp.ports is the
    # successor but that flag is NOT yet defined on `service` (verified
    # 04-11-2026: 'flag provided but not defined') — deprecated-but-working
    # is the only option today; re-check on a future myst upgrade.
    # Location flags BEFORE `service` are app-level (after it they crash-loop,
    # same class as --udp.ports): the oracle labels ASN 50266 (Odido behind
    # this Glasoperator FTTH line) as "cellular", which hides the node from
    # residential-filtering consumers; manual resolver = truthful "residential".
    # NOTE: the image entrypoint execs args UNQUOTED — space-containing values
    # die on word-splitting ('No help topic for Stad'); use single-word city.
    command: ["--location.type", "manual", "--location.country", "NL", "--location.city", "Almere", "--location.ip-type", "residential", "service", "--agreed-terms-and-conditions", "--wireguard.listen.ports", "61000:61100"]
    labels:
      diun.enable: "true"
    ports:
      - "4449:4449"
      - "61000-61100:61000-61100/udp"
    volumes:
      - myst-data:/var/lib/mysterium-node
    networks:
      - myst-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Honeygain (2026-11-04): bandwidth sharing (passive income) ---
  # Same untrusted-vendor hard sandbox as traffmonetizer/pawns (egress-only
  # CLI: default bridge, no caps, no volumes, no ports, tmpfs scratch,
  # limits, logs 10m x3, diun + daily auto-update on floating :latest).
  # Vetting note 2026-11-04: Google's XCPE report explicitly names
  # Honeygain's own AppSalt SDK (silent optIn() without consent screen on
  # third-party devices; owner Oxylabs gave no reply when contacted).
  # Deployed anyway on Robert's explicit decision — exposure consciously
  # accepted; revisit if the vendor ever publishes a public statement.
  # device sv01 = the one earning device on this network (Honeygain only
  # pays for devices on different IPs). Creds via compose-interpolation
  # from sv01.env: HONEYGAIN_EMAIL / HONEYGAIN_PASSWORD ($ in a password
  # must be doubled to $$). No -token mode exists in this image — only
  # -email/-pass/-device (Google-signup accounts need a password set first).
  honeygain:
    image: honeygain/honeygain:latest
    container_name: sv01-honeygain
    restart: unless-stopped
    cap_drop: [ALL]
    labels:
      diun.enable: "true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    command: ["-tou-accept", "-email", "${HONEYGAIN_EMAIL}", "-pass", "${HONEYGAIN_PASSWORD}", "-device", "sv01"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- ProxyRack (2026-11-04): peer program — bandwidth sharing (passive income) ---
  # Vetted: NOT named in Google's XCPE report; Trustpilot 4.3 with recent
  # payout-arrival reviews (~3 days); $0.50/GB (highest GB rate of the cash
  # apps), $5 PayPal min; demand-gated (can sit idle for stretches).
  # ⚠️ Honest caveat: the official proxyrack/pop image is a WRAPPER that
  # downloads and runs the actual PoP client from vendor servers at each
  # boot ("latest client script") — runtime-fetched code by design; the
  # hard sandbox below is the containment: no caps, no volumes, no ports,
  # tmpfs scratch, mem/cpu limits, diun + daily auto-update on :latest.
  # Identity: self-generated 64-hex UUID in sv01.env (PROXYRACK_UUID);
  # PROXYRACK_API_KEY (dashboard) makes the wrapper self-register the
  # device in the dashboard at boot (retry loop); DEVICE_NAME = sv01.
  proxyrack:
    image: proxyrack/pop:latest
    container_name: sv01-proxyrack
    restart: unless-stopped
    cap_drop: [ALL]
    labels:
      diun.enable: "true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      UUID: ${PROXYRACK_UUID}
      API_KEY: ${PROXYRACK_API_KEY}
      DEVICE_NAME: "sv01"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- EarnApp (2026-11-04): Bright Data bandwidth sharing (passive income) ---
  # Official Linux support is BACK (was "temporarily disabled" per vendor;
  # help center documents Linux install again — Robert's correction of the
  # earlier "rules out home servers" verdict). NOT named in Google's XCPE
  # report. Image: NOT a proxyrack-style runtime wildcard — acoilier/earnapp
  # is a community wrapper that BAKES the official BrightData installer at
  # BUILD time with a PINNED SHA256 (upstream change = their public CI build
  # fails, no silent code swaps); Trivy-scanned, cosign-signed, public CI.
  # The first boot still fetches the actual agent binaries from the vendor —
  # the sandbox is the containment.
  # Deviation from the all-ephemeral recipe (like myst): /etc/earnapp
  # (device identity + state) on a named NFS volume — recreating the container
  # must NOT orphan the dashboard device. Else: no caps, default bridge,
  # no published ports, tmpfs, limits, logs, diun + autoheal
  # (image ships a HEALTHCHECK = `pgrep -x earnapp` — real daemon check).
  # 🚨 The image's OWN entrypoint is bypassed; its monitor uses `earnapp
  # start`, a systemctl-only no-op in this systemd-less container → no daemon
  # → unhealthy → autoheal restart-loop (~5 min). Our entrypoint (bind-mounted
  # from ./earnapp/entrypoint.sh) runs the OFFICIAL pair instead:
  # `earnapp autoupgrade` (bg poller) + `earnapp run` (PID 1 daemon) — the two
  # official systemd-unit ExecStarts. Verified 2026-11-04: that pair holds
  # stable TLS connections; `earnapp start` never leaves a daemon here.
  # UUID: sdk-node-<32hex> pre-generated into sv01.env (EARNAPP_UUID);
  # account linking = ONE browser click on https://earnapp.com/r/<uuid>
  # (Robert, AFTER first boot — runbook in the docspage).
  earnapp:
    image: acoilier/earnapp:latest
    container_name: sv01-earnapp
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      diun.enable: "true"
      autoheal: "true"
    tmpfs:
      # acoilier's tested hardening defaults ("/tmp:exec" — installer execs
      # from tmp; deliberately NOT the class noexec default here)
      - /tmp:exec,mode=1777
      - /run
    environment:
      EARNAPP_UUID: ${EARNAPP_UUID}
    entrypoint: ["/bin/bash", "/usr/local/bin/earnapp-safe.sh"]
    volumes:
      - earnapp-data:/etc/earnapp
      - ./earnapp/entrypoint.sh:/usr/local/bin/earnapp-safe.sh:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Grafana + VictoriaMetrics (2026-11-04): energy dashboards ---
  # Single-node VictoriaMetrics (Prometheus-compatible, small footprint):
  # host-native energy-poller.service (sv01/scripts/energy_poller.py) pushes
  # P1/Zendure/controller/Homey/price samples every 10 s to 127.0.0.1:8428.
  # Grafana UI = Caddy route grafana.oostrandpark.com (Authelia-gated,
  # anonymous Viewer; Grafana admin login via the same route) — no published
  # port. Dashboards + datasource provisioned from sv01/compose/grafana/.
  # Both databases on NFS per convention (kuma already proves sqlite-on-NFS
  # fine at this write rate; watch VM logs — NFS is not VM's favorite FS).
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: sv01-victoria-metrics
    restart: unless-stopped
    labels:
      diun.enable: "true"
    command: ["-retentionPeriod=3y", "-storageDataPath=/data"]
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vm-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: sv01-grafana
    restart: unless-stopped
    labels:
      diun.enable: "true"
    environment:
      GF_SECURITY_ADMIN_USER: rkruit
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: https://grafana.oostrandpark.com
      TZ: Europe/Amsterdam
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # grafana + VM data — NFS per convention (fresh subdirs created 777
  # BEFORE first apply; see docs/infra/nfs-storage.md)
  grafana-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/grafana-data"

  vm-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/vm-data"

  caddy-data:
  caddy-config:
  komodo-keys:
  komodo-repo-cache:
  komodo-mongo-data:
  komodo-mongo-config:
  todo-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      # zelfde NFS-map als de oude k3s PVC — data gaat naadloos mee
      device: ":/volume1/k8sv2/todo-app-todo-app-data-pvc-f673b41b-3742-45ab-81b1-aa8cf6c73588"

  hermes-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/hermes-data"

  beszel-agent-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/beszel-agent-data"

  kuma-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/kuma-data"

  beszel-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/beszel-data"

  # diun-cache (digest-state) — regenereerbaar, maar volgens conventie op NFS
  diun-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/diun-data"

  # sessie-opslag van de WAHA WhatsApp-bridge — NFS volgens conventie
  waha-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/waha-data"

  # MystNodes identity/keystore + node-database — NFS volgens conventie
  myst-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/myst-data"

  # EarnApp device identity + node state (uuid en co) — NFS volgens conventie;
  # persistent identity is een vendor-eis (leeg = orphan dashboard-devices)
  earnapp-data:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=192.168.1.2,rw,hard,timeo=600
      device: ":/volume1/k8sv2/earnapp-data"

  # socket tussen beszel-hub en agent — NIET op NFS (unix socket)
  beszel-socket:

  # authelia sqlite-db — LOKAAL (niet NFS): sqlite-locking-risico, zoals mongo
  authelia-data:

networks:
  # interne netwerk: geen default route, geen internet, geen LAN
  hermes-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # alleen de squid-proxy hangt hier aan (heeft internet nodig)
  hermes-egress:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  # MystNodes eigen netwerk: los van de rest van de stack (geen toegang tot
  # de andere sv01-containers), mét internet-egress (broker/session-traffic)
  myst-net: