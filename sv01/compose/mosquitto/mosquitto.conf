# Mosquitto 2.x on sv01 (phase 2, 2026-10-30)
# LAN-only listener on 1883 (host bind 192.168.1.10 — no public port, no Caddy
# route since MQTT is raw TCP). Auth mandatory; ACL splits homey vs hermes.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.file

# persistence.db goes to the mosquitto-data NFS volume (single writer broker)
persistence true
persistence_location /mosquitto/data/

# logs to stdout (docker log driver, json-file rotation in compose)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe
log_type unsubscribe
connection_messages true