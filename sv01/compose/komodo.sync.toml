# Komodo ResourceSync-definitie — gelezen door sync "k3s-gitops"
# Git blijft de enige bron: dit declareert de stack zoals git hem wil
[[stack]]
name = "sv01"
description = "sv01 compose-stack (caddy, todo-app, komodo)"
deploy = true

[stack.config]
server = "Local"
git_provider = "github.com"
git_account = "RKruit"
repo = "RKruit/k3s-gitops"
branch = "main"
file_paths = ["sv01/compose/docker-compose.yml"]
env_file_path = "/etc/komodo/sv01-secrets/sv01.env"
auto_pull = true
poll_for_updates = true
auto_update = true
auto_update_all_services = true
webhook_enabled = true

[stack.config.post_deploy]
command = "docker exec sv01-caddy caddy reload --config /etc/caddy/Caddyfile || true"
