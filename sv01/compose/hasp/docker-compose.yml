services:
  bridge:
    build: ./bridge
    container_name: sv01-homey-bridge
    restart: unless-stopped
    environment:
      MQTT_HOST: 192.168.1.10
      MQTT_PORT: "1883"
      MQTT_USER: hasp
    env_file:
      - /opt/hasp-secrets/hasp.env

  logic:
    build: ./logic
    container_name: sv01-homey-logic
    restart: unless-stopped
    environment:
      MQTT_HOST: 192.168.1.10
      MQTT_PORT: "1883"
      MQTT_USER: hasp
    env_file:
      - /opt/hasp-secrets/hasp.env
