- Homelab:
    - Todo-app:
        icon: mdi-check-circle
        href: https://todo.oostrandpark.com
        server: local
        container: sv01-todo-app
    - Komodo:
        icon: komodo.png
        href: https://komodo.oostrandpark.com
        server: local
        container: sv01-komodo-core
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://kuma.oostrandpark.com
        server: local
        container: sv01-uptime-kuma
        widget:
          type: uptimekuma
          url: http://192.168.1.10:3001
          slug: sv01
    - Beszel:
        icon: beszel.png
        href: https://beszel.oostrandpark.com
        server: local
        container: sv01-beszel
    - Docs:
        icon: mkdocs.png
        href: https://docs.oostrandpark.com
        server: local
        container: sv01-docs
    - IT-Tools:
        icon: it-tools.svg
        href: https://tools.oostrandpark.com
        server: local
        container: sv01-it-tools
    - Homey Energie:
        icon: mdi-home-bolt
        href: https://my.homey.app
        widget:
          type: customapi
          # host-side exporter (systemd sv01-homey-energy): energy/live van de
          # hub -> JSON; alleen bereikbaar op het LAN, geen auth nodig
          url: http://192.168.1.10:8890/energy.json
          refreshInterval: 60000
          mappings:
            - field: consumed_w
              label: Verbruik
              format: number
            - field: generated_w
              label: Opbrengst
              format: number
            - field: top_1_name
              label: Grootste last
            - field: top_1_w
              label: Top W
              format: number
