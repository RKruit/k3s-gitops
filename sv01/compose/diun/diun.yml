# diun — update-watchdog: controleert registries en meldt nieuwe image-tags op
# Telegram. Watchen gebeurt OPT-IN via container-label `diun.enable=true`
# (watch_by_default=false).
# De Telegram-notifier wordt geactiveerd door de env-file van het
# compose-service: /srv/sv01-secrets/diun.env
# (DIUN_NOTIF_TELEGRAM_TOKEN / DIUN_NOTIF_TELEGRAM_CHATIDS) — in dit
# configuratiebestand zit bewust geen notificatie-/tokengeheim (diun 4.x heeft
# géén "enable"-veld meer; lege/afwezige notif-block + env-vars volstaat).
watch:
  schedule: "0 5 * * *" # dagelijks 05:00 — ná de image-update-run van 04:17
  first_check_notif: false # eerste run = baseline, geen meldingen
providers:
  docker:
    watch_by_default: false