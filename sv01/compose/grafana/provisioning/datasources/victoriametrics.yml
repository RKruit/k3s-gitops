apiVersion: 1
datasources:
  # VictoriaMetrics single-node (compose 'victoria-metrics') — Prometheus-DS
  # against its /prometheus-compatible query API. UID referenced by the
  # provisioned dashboards in ./dashboards.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      prometheusType: Prometheus