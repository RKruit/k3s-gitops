# sv01: egress-allowlist-proxy voor de Hermes-container.
# Alle uitgaande HTTP(S) van de agentcontainer loopt via deze proxy;
# alleen CONNECT (HTTPS) naar api.telegram.org gaat er doorheen,
# al het andere wordt geweigerd (prompt-injection/exfiltratie-fence).
http_port 3128

acl all src all
acl telegram dstdomain .api.telegram.org
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT telegram
http_access deny all

cache deny all
coredump_dir /var/spool/squid