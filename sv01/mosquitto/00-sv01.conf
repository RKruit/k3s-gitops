# sv01 phase-2 broker (2026-10-30) — canonical copy (deployed to /etc/mosquitto/conf.d/00-sv01.conf)
# NOTE: Ubuntu apparmor confines the mosquitto binary to /etc/mosquitto,
# /var/lib/mosquitto, /var/log/mosquitto, /run/mosquitto — everything must
# live under those paths (a containerized broker gets denied opens, verified
# via audit logs on this host). persistence is set in the main config
# (defaults to /var/lib/mosquitto).
listener 1883 192.168.1.10
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.file
log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe
log_type unsubscribe
connection_messages true