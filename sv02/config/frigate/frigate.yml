# Frigate configuration for sv02 (docker compose)
#
# Pitfalls baked in to avoid the sv01 3-bug setup chain:
#   1. mqtt.host is "mosquitto.sv02.internal" (the docker network DNS
#      name, NOT "mosquitto.mqtt.svc.cluster.local" — that was the
#      sv01 mistake, fixed here).
#   2. mqtt-password lives in /srv/sv02/secrets/mosquitto.env on the
#      host and is loaded via $FRIGATE_MQTT_PASSWORD env var.
#   3. cameras.<cam>.detect.enabled: true is set explicitly so
#      Frigate's _set_initial_topics publishes retained ON on every
#      MQTT connect. Without this, the dispatcher defaults to OFF
#      and detection silently disables itself on every reconnect.
#
# Camera credentials: {FRIGATE_CAM_USER} and {FRIGATE_CAM_PASS}
# placeholders are rendered at parse time from environment variables
# loaded via env_file /srv/sv02/secrets/frigate-cam.env.

# === Auth: disabled (Caddy is the front door) ===
auth:
  enabled: false

# === Birdseye (live overview grid) ===
birdseye:
  enabled: true
  mode: objects
  quality: 8

# === Cameras ===
cameras:
  # === Camera 1: Tapo C210 ===
  tapo_c210:
    enabled: true
    ffmpeg:
      inputs:
        - path: 
            rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@192.168.68.134:554/stream2
          input_args: -rtsp_transport tcp
          roles:
            - detect
        - path: 
            rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@192.168.68.134:554/stream1
          input_args: -rtsp_transport tcp
          roles:
            - record
      # Re-encode the recording stream with libx264 + yuv420p so Safari /
      # macOS VideoToolbox can play it back. The default `-c:v copy` produces
      # an MP4 that Apple's decoder rejects (VTDecompressionOutputCallback
      # -12909). libx264 ultrafast has modest CPU cost; for 3-4 cameras we
      # can switch to h264_vaapi once verified.
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v libx264 -preset ultrafast -b:v 4M -pix_fmt yuv420p -c:a aac
    detect:
      enabled: true
      fps: 5
      height: 360
      width: 640

  # === Camera 2-4: placeholders ===
  # Copy the tapo_c210 block, change the camera name and IP, and add
  # the new camera to the `cameras:` section. Don't forget `detect.enabled: true`.

# === Object detection model ===
model:
  height: 320
  width: 320
  labelmap_path: /labelmap.txt
  model_type: ssd
  path: /edgetpu_model.tflite

# === Coral USB detector ===
detectors:
  coral:
    device: usb
    type: edgetpu

# === Motion detection pre-filter ===
motion:
  contour_area: 100
  delta_alpha: 0.2
  frame_alpha: 0.2
  frame_height: 100
  mask: []
  threshold: 25

# === MQTT ===
mqtt:
  enabled: true
  host: mosquitto.sv02.internal
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'
  client_id: frigate
  topic_prefix: frigate

# === Recording policy: motion-only ===
# Frigate 0.17 format: top-level record.retain has modes
# (motion, active_objects, all) and days. No separate
# `record.alerts` / `record.detections` blocks.
record:
  enabled: true
  retain:
    days: 14
    mode: motion
  alerts:
    pre_capture: 5
    post_capture: 5
  detections:
    pre_capture: 5
    post_capture: 5

# === Snapshots ===
snapshots:
  enabled: true
  retain:
    default: 14

# === Live view quality ===
live:
  quality: 8

# === Frigate version hint ===
version: 0.17-0
