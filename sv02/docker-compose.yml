# Docker Compose for sv02 (homelab NVR + reverse proxy)
#
# Replaces the podman+Quadlet setup that had a newuidmap bug on
# Trixie. Docker daemon runs as root, no user namespace, no
# newuidmap. We pin uid:gid per service to keep the security
# posture reasonable.
#
# Bring it all up:
#   docker compose up -d
#
# Tail logs:
#   docker compose logs -f
#
# Stop:
#   docker compose down
#
# The systemd unit sv02-docker.service (installed by
# setup-host.sh) runs `docker compose up -d` on boot.

name: sv02

services:
  # === Mosquitto MQTT broker ===
  # Single instance, anonymous=false, no persistence (we don't need
  # durable subscriptions — Frigate is the only consumer, and it
  # resubscribes on restart).
  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2.0
    container_name: mosquitto
    hostname: mosquitto.sv02.internal
    restart: unless-stopped
    user: "1883:1883"  # the eclipse-mosquitto image's default user
    networks:
      - sv02
    ports:
      - "1883:1883"
    volumes:
      # The password file is rendered by the mosquitto-init service
      # (see below) and bind-mounted in.
      - /srv/sv02/mosquitto/data:/mosquitto/data:rw
    # Override the image's default CMD. The image's CMD points at
    # /mosquitto/config/mosquitto.conf, but we mount our config at
    # /mosquitto/data/mosquitto.conf (rendered by the init service).
    command: ["mosquitto", "-c", "/mosquitto/data/mosquitto.conf"]
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    # Healthcheck disabled: the mosquitto_sub-based check has too
    # many escaping issues across compose versions. The container
    # IS up and listening on 1883; we can verify with
    # `docker exec mosquitto mosquitto_pub -h localhost ...` from
    # the host.
    # If you want a healthcheck, use:
    #   test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/1883 && echo -e '\\x10\\x12\\x00\\x06MQIsdp\\x03\\x02\\x00\\x00' >&3 && head -c 4 <&3"]
    # (raw MQTT CONNECT packet, no auth)
    env_file:
      - /srv/sv02/secrets/mosquitto.env
    logging:
      driver: journald
      options:
        tag: mosquitto

  # === mosquitto-init ===
  # One-shot: renders /srv/sv02/mosquitto/data/mosquitto.conf and
  # passwd from the env vars (MQTT_USER, MQTT_PASSWORD, set via
  # env_file below), then exits. The main mosquitto service
  # depends_on this completing successfully.
  #
  # We use the mosquitto image itself (which has mosquitto_passwd)
  # and run the render-mqtt-passwd.sh script as a bind-mount. The
  # script handles both docker and host contexts.
  mosquitto-init:
    image: docker.io/library/eclipse-mosquitto:2.0
    container_name: mosquitto-init
    user: "0:0"  # needs to chown the data dir (see script)
    networks:
      - sv02
    volumes:
      - /srv/sv02/mosquitto/data:/mosquitto/data:rw
      - ./scripts/render-mqtt-passwd.sh:/render-mqtt-passwd.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    # The image is Alpine-based and doesn't have bash by default.
    # We install bash + the script, then run the script with $1 =
    # the data dir inside the container (/mosquitto/data).
    # MQTT_USER / MQTT_PASSWORD are set via env_file below.
    command: >
      "apk add --no-cache bash >/dev/null 2>&1;
       install -d -m 755 /mosquitto/data;
       bash /render-mqtt-passwd.sh /mosquitto/data"
    env_file:
      - /srv/sv02/secrets/mosquitto.env
    restart: "no"
    logging:
      driver: journald
      options:
        tag: mosquitto-init

  # === Frigate NVR ===
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.16.1
    container_name: frigate
    hostname: frigate.sv02.internal
    restart: unless-stopped
    privileged: true  # Coral + privileged ports
    networks:
      - sv02
    ports:
      - "5000:5000"   # internal plain HTTP (Caddy talks to this)
      - "8554:8554"   # RTSP
      - "1984:1984"   # go2rtc WebRTC
      - "127.0.0.1:8971:8971"  # frigate API (loopback only)
    volumes:
      - /srv/sv02/frigate/config:/config:rw
      - /srv/sv02/frigate/media:/media:rw
      - /srv/sv02/frigate/db:/db:rw
      # The Frigate 0.16.1 image ships with its own libedgetpu and
      # libusb built in (Debian Bookworm versions). We do NOT
      # bind-mount them from /opt/coral-libs/ — those are the Trixie
      # builds and are not glibc-compatible with the Bookworm
      # container (GLIBC_2.38 not found error).
      #
      # If you need to override (e.g., to use a newer libedgetpu
      # that feranick builds), re-add the bind-mounts here.
      - /dev/bus/usb:/dev/bus/usb
      - /sys/bus/usb:/sys/bus/usb:ro
    environment:
      CONFIG_FILE: /config/frigate.yml
      TZ: Europe/Amsterdam
    env_file:
      - /srv/sv02/secrets/frigate-cam.env
      - /srv/sv02/secrets/frigate-mqtt.env
    depends_on:
      mosquitto:
        condition: service_started
    # Healthcheck disabled: same reason as mosquitto (escaping pain).
    # Frigate 0.16 has its own internal health endpoint, but the
    # wget-based check is flaky. If you want a healthcheck, use:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/version || exit 1"]
    logging:
      driver: journald
      options:
        tag: frigate

  # === Caddy reverse proxy ===
  # Terminates TLS for the hostnames in /etc/caddy/Caddyfile
  # (which is bind-mounted from the repo). Issues Let's Encrypt
  # certs via HTTP-01 (port 80 reachable from internet).
  caddy:
    image: docker.io/library/caddy:2.8-alpine
    container_name: caddy
    hostname: caddy.sv02.internal
    restart: unless-stopped
    networks:
      - sv02
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_CONFIG_DIR: /etc/caddy
      CADDY_DATA_DIR: /data
    depends_on:
      - frigate
    # Healthcheck disabled: caddy auto-detects config errors on
    # start, and the admin API is on localhost:2019 inside the
    # container. If you want a healthcheck, use:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:2019/config/ || exit 1"]
    logging:
      driver: journald
      options:
        tag: caddy

volumes:
  caddy_data:
  caddy_config:

networks:
  sv02:
    driver: bridge
    name: sv02
    ipam:
      config:
        - subnet: 10.89.0.0/24
          gateway: 10.89.0.1
