apiVersion: apps/v1
kind: Deployment
metadata:
  name: anna
  namespace: anna
  labels:
    app: anna
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anna
  template:
    metadata:
      labels:
        app: anna
      annotations:
        # Force pod restart when ConfigMap content changes (works around
        # the standard "configmap change does not restart pod" issue).
        checksum/config: e12ad0739c10ab6ef7db7132affa16a6c5c2fc5436a0fa5a7e9054f2e9f38070
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html
          configMap:
            name: anna-html
        - name: nginx-config
          configMap:
            name: anna-nginx-config
