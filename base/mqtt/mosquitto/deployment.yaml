apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      initContainers:
        - name: passwd-init
          image: eclipse-mosquitto:2
          command: ["sh", "-c"]
          args:
            - |
              USERNAME=$(cat /etc/mosquitto-creds/username)
              PASSWORD=$(cat /etc/mosquitto-creds/password)
              mkdir -p /mosquitto-data
              touch /mosquitto-data/passwd
              mosquitto_passwd -b /mosquitto-data/passwd "${USERNAME}" "${PASSWORD}"
              echo "--- passwd file contents ---"
              cat /mosquitto-data/passwd
          volumeMounts:
            - name: passwd-data
              mountPath: /mosquitto-data
            - name: mosquitto-creds
              mountPath: /etc/mosquitto-creds
              readOnly: true
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: passwd-data
              mountPath: /mosquitto/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: mosquitto-config
          configMap:
            name: mosquitto-config
        - name: mosquitto-creds
          secret:
            secretName: mosquitto-password
            items:
              - key: username
                path: username
              - key: password
                path: password
        - name: passwd-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
