apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Development:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Infrastructure:
        - Netdata:
            href: https://netdata.oostrandpark.com
            description: Server monitoring
        - Uptime Kuma:
            href: https://uptime.oostrandpark.com
            description: Status monitoring
        - ArgoCD:
            href: https://argocd.oostrandpark.com
            description: GitOps deployments
            widget:
              type: argocd
              url: https://argocd.oostrandpark.com
              key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhcmdvY2QiLCJzdWIiOiJob21lcGFnZTphcGlLZXkiLCJuYmYiOjE3NzgxMDE1MTUsImlhdCI6MTc3ODEwMTUxNSwianRpIjoiMWZhMmQ1NjItNDM3NS00NmFkLWJmMTMtYmQ2NmIxNjMxMTRlIn0.KI8fNu5Q60fKY8vTzUDGCUHpYlrYJhStsETCUU1GpSY
    - Media:
        - Jellyfin:
            href: https://jellyfin.oostrandpark.com
            description: Media server
    - Passive Income:
        - Dashboard:
            href: https://passive.oostrandpark.com
            description: Earnings dashboard
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "sv01"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
