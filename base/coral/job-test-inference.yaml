# One-shot Job that runs the Coral inference test and exits.
# Use this to verify the device works from a pod after every deploy:
#
#   kubectl logs -n coral -f job/coral-test-run
#
# If it logs "OK Coral USB Accelerator working from inside the pod",
# the Coral is reachable from the cluster. Cron it later if you want
# a regular liveness check.
apiVersion: batch/v1
kind: Job
metadata:
  name: coral-test-run
  namespace: coral
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: coral-test
        run: inference
    spec:
      restartPolicy: Never
      nodeSelector:
        coral: present
      containers:
        - name: test
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Installing Python deps ..."
              pip install --break-system-packages --quiet ai-edge-litert numpy
              echo "Running inference test ..."
              exec python3 /workspace/coral/test.py
          env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib:$LD_LIBRARY_PATH
          # Coral needs to open USB character devices, which requires
          # CAP_SYS_RAWIO — easier to just run as privileged. This is a
          # single-tenant homelab; the security cost is negligible.
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: libedgetpu
              mountPath: /usr/local/lib/libedgetpu.so.1
              readOnly: true
            - name: libusb
              mountPath: /usr/local/lib/libusb-1.0.so.0
              readOnly: true
            - name: usb-dev
              mountPath: /dev/bus/usb
            - name: usb-sys
              mountPath: /sys/bus/usb
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: scripts
              mountPath: /workspace/coral
              readOnly: true
      volumes:
        - name: libedgetpu
          hostPath:
            path: /lib/x86_64-linux-gnu/libedgetpu.so.1
            type: File
        - name: libusb
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0
            type: File
        - name: usb-dev
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: usb-sys
          hostPath:
            path: /sys/bus/usb
            type: Directory
        - name: workspace
          emptyDir: {}
        - name: scripts
          configMap:
            name: coral-test-script
            defaultMode: 0o755
