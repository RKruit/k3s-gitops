# Self-contained Coral inference test script.
# Mounted into test pods at /workspace/coral/test.py and /workspace/coral/run-test.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coral-test-script
  namespace: coral
data:
  test.py: |
    """Quick inference sanity test for the Coral USB Accelerator.

    Invoked by run-test.sh which has already installed ai-edge-litert and numpy.
    This script does NOT have a shebang because it's mounted read-only from
    a ConfigMap.
    """
    import sys
    import time
    import urllib.request

    import ai_edge_litert.interpreter as itp
    import numpy as np

    MODEL_URL = (
        "https://github.com/google-coral/edgetpu/raw/refs/heads/master/"
        "test_data/mobilenet_v1_1.0_224_quant_edgetpu.tflite"
    )
    MODEL_PATH = "/workspace/mobilenet_v1_1.0_224_quant_edgetpu.tflite"

    # 1. Ensure model is on disk.
    try:
        open(MODEL_PATH, "rb").close()
    except FileNotFoundError:
        print(f"Downloading {MODEL_URL} ...", flush=True)
        urllib.request.urlretrieve(MODEL_URL, MODEL_PATH)

    # 2. Load the EdgeTPU delegate (libedgetpu.so.1 is bind-mounted from host).
    print("Loading libedgetpu delegate ...", flush=True)
    delegate = itp.load_delegate("libedgetpu.so.1")

    # 3. Build interpreter with the delegate.
    interp = itp.Interpreter(
        model_path=MODEL_PATH, experimental_delegates=[delegate]
    )
    interp.allocate_tensors()
    inp = interp.get_input_details()[0]
    out = interp.get_output_details()[0]
    print(f"Input:  shape={inp['shape']} dtype={inp['dtype']}")
    print(f"Output: shape={out['shape']} dtype={out['dtype']}")

    # 4. Warmup + 10 timed runs.
    warm = np.random.randint(0, 255, size=inp["shape"], dtype=np.uint8)
    interp.set_tensor(inp["index"], warm)
    interp.invoke()

    timings = []
    for i in range(10):
        x = np.random.randint(0, 255, size=inp["shape"], dtype=np.uint8)
        interp.set_tensor(inp["index"], x)
        t0 = time.perf_counter()
        interp.invoke()
        t1 = time.perf_counter()
        timings.append((t1 - t0) * 1000)
        top = int(np.argmax(interp.get_tensor(out["index"])[0]))
        print(f"  run {i+1:2d}: {timings[-1]:6.2f} ms  top class = {top}")

    avg = sum(timings) / len(timings)
    print()
    print("OK Coral USB Accelerator working from inside the pod")
    print(f"   avg latency: {avg:.2f} ms over {len(timings)} runs")
  run-test.sh: |
    #!/bin/sh
    # Wrapper that runs the inference test.
    # Used by job-test-inference.yaml.
    set -e
    # The ConfigMap is mounted read-only; exec python directly.
    exec python3 /workspace/coral/test.py
