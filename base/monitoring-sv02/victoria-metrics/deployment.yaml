    29|            requests:
    30|              cpu: "100m"
    31|              memory: "256Mi"
    32|            limits:
    33|              cpu: "500m"
    34|              memory: "512Mi"
    35|          volumeMounts:
    36|            - name: data
    37|              mountPath: /victoria-metrics-data
