    39|              mountPath: /etc/prometheus
    40|              readOnly: true
    41|      volumes:
    42|        - name: data
    43|          persistentVolumeClaim:
    44|            claimName: victoria-metrics-data
    45|        - name: config
    46|          configMap:
    47|            name: victoria-metrics-scrape
    48|            items:
