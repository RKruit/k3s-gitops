     1|apiVersion: apps/v1
     2|kind: Deployment
     3|metadata:
     4|  name: victoria-metrics
     5|  namespace: monitoring
     6|  labels:
     7|    app: victoria-metrics
     8|spec:
     9|  replicas: 1
    10|  selector:
    11|    matchLabels:
    12|      app: victoria-metrics
    13|  template:
    14|    metadata:
    15|      labels:
    16|        app: victoria-metrics
    17|    spec:
    18|      serviceAccountName: victoria-metrics
