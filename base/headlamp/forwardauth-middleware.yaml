# Optional: Traefik ForwardAuth middleware for Authentik
# If you prefer ForwardAuth over native OIDC, uncomment the middleware annotation
# in ingress.yaml and this resource will be used.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: headlamp
spec:
  forwardAuth:
    address: "http://authentik-server.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
