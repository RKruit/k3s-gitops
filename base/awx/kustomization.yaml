apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: awx

resources:
  # AWX Operator 2.19.1 (latest stable)
  - github.com/ansible/awx-operator/config/default?ref=2.19.1
  - awx-instance.yaml
  - certificate.yaml
  - ingress.yaml

images:
  - name: quay.io/ansible/awx-operator
    newTag: 2.19.1

# gcr.io/kubebuilder/kube-rbac-proxy is discontinued — remove the sidecar
patches:
  - target:
      kind: Deployment
      name: awx-operator-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: awx-operator-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: kube-rbac-proxy
                $patch: delete