---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
  labels:
    app: frigate
spec:
  # Recreate strategy: with a single PVC-backed media volume, a rolling
  # update would try to mount the same PVC in two pods simultaneously.
  # Recreate is the safe choice for single-replica + RWO PVC.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      # --- Coral USB: pin to the labelled node ---
      nodeSelector:
        coral: present

      # Frigate needs root for the rtsp/simplejpeg server and the privileged
      # Coral device access. Don't try to drop to non-root.
      securityContext:
        runAsUser: 0
        runAsGroup: 0

      containers:
        # --- main Frigate container ---
        # Custom image: ghcr.io/rkruit/frigate-coral:0.16.1 — extends the
        # official Frigate 0.16.1 with a newer libstdc++ at /opt/libstdcpp
        # (from Ubuntu 24.04's libstdc++6 deb) so the host's libedgetpu.so.1
        # (which needs GLIBCXX_3.4.32) can resolve its symbols.
        - name: frigate
          image: ghcr.io/rkruit/frigate-coral:0.16.1
          imagePullPolicy: Never
          # The frigate image expects to run as root and bind privileged ports.
          securityContext:
            privileged: true
            # Coral USB char-device access — keep capabilities generous.
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_RESOURCE
                - NET_ADMIN
                - NET_RAW
                - DAC_OVERRIDE
                - DAC_READ_SEARCH
                - CHOWN
                - FOWNER
                - SETUID
                - SETGID
                - KILL
                - SYS_CHROOT
                - AUDIT_WRITE
                - AUDIT_CONTROL
                - SYS_PTRACE
                - SYS_MODULE
                - LEASE
                - WAKE_ALARM
                - BLOCK_SUSPEND
                - IPC_LOCK
                - SYS_RAWIO
                - SYS_TTY_CONFIG
                - SYS_BOOT
                - SYS_NICE
                - SYS_PACCT
                - SYSLOG
                - MKNOD
                - SETFCAP
                - NET_BIND_SERVICE
          ports:
            - name: web
              containerPort: 8971
            - name: rtsp
              containerPort: 8554
            - name: rtmp
              containerPort: 1935
          env:
            # === secrets (injected from SealedSecret) ===
            - name: FRIGATE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: admin-password
            - name: FRIGATE_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: mqtt-password
            # === Coral USB runtime ===
            # libedgetpu.so.1 (bind-mounted from the host) is patched with
            # patchelf to have RPATH=/opt/libstdcpp (the libstdc++ in our
            # custom image). So it picks up the newer libstdc++ on its
            # own — no global LD_LIBRARY_PATH needed (which would break
            # cv2 etc., since the Ubuntu 24.04 libstdc++ needs glibc 2.38).
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib
            # === timezone ===
            - name: TZ
              value: Europe/Amsterdam
            # === performance / shm ===
            - name: YOLO_MODELS
              value: ""
            # --- Frigate (>=0.16) reads config path from $CONFIG_FILE (verified
            #     in /opt/frigate/frigate/util/config.py:21) ---
            - name: CONFIG_FILE
              value: /config/config.yml
            # --- Coral edgetpu library path (used by the edgetpu detector) ---
            - name: EDGETPU_SHARED_LIB
              value: /usr/local/lib/libedgetpu.so.1
          # --- Frigate main container. Image is s6-overlay based; the default
          #     service runs `python3 -u -m frigate` with cwd=/opt/frigate. We
          #     set workingDir so relative paths resolve the same way, and
          #     $FRIGATE_CONFIG env var so the right config is read (Frigate's
          #     --config CLI arg was removed in 0.16.x). ---
          command: ["/usr/bin/python3"]
          args:
            - "-u"
            - "-m"
            - "frigate"
          workingDir: /opt/frigate

          startupProbe:
            httpGet:
              path: /api/version
              port: web
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/version
              port: web
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/version
              port: web
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
          # --- shared memory for inter-process communication (FFmpeg etc.) ---
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: db
              mountPath: /db
            - name: cache
              mountPath: /cache
            # === Coral USB: the 7 essential pieces ===
            - name: libedgetpu
              mountPath: /usr/local/lib/libedgetpu.so.1
              readOnly: true
            - name: libusb
              mountPath: /usr/local/lib/libusb-1.0.so.0
              readOnly: true
            - name: usb-dev
              mountPath: /dev/bus/usb
            - name: usb-sys
              mountPath: /sys/bus/usb
              readOnly: true

        # --- init: render the config (replace ${FRIGATE_MQTT_PASSWORD} and
        # bcrypt the admin password) and warm up. ---
        - name: render-config
          image: docker.io/python:3.12-slim
          securityContext:
            privileged: true
          env:
            - name: FRIGATE_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: mqtt-password
            - name: FRIGATE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: admin-password
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib
          command:
            - sh
            - -c
            - |
              set -eu
              pip install --no-cache-dir --quiet bcrypt >/dev/null
              python3 - <<'PY'
              import os, re
              import bcrypt
              with open('/template/config.yml','r') as f:
                  cfg = f.read()
              # Substitute MQTT password placeholder
              cfg = cfg.replace('${FRIGATE_MQTT_PASSWORD}', os.environ['FRIGATE_MQTT_PASSWORD'])
              # bcrypt-hash the admin password (Frigate uses bcrypt $2b$ hashes)
              h = bcrypt.hashpw(os.environ['FRIGATE_ADMIN_PASSWORD'].encode(), bcrypt.gensalt(rounds=12)).decode()
              # Insert `password_hash: "..."` with the same 2-space indent as `enabled`
              cfg = re.sub(
                  r'(auth:\n  enabled: True\n)',
                  r'\1  password_hash: "' + h + '"\n',
                  cfg, count=1
              )
              with open('/config/config.yml','w') as f:
                  f.write(cfg)
              # Remove the image's default /config/config.yaml so Frigate can't fall
              # back to the placeholder "name_of_your_camera" if it ever reloads.
              if os.path.exists('/config/config.yaml'):
                  os.remove('/config/config.yaml')
              print("Config rendered; admin password bcrypt-hashed; default config.yaml removed")
              PY
              chmod 0644 /config/config.yml
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: config
              mountPath: /config

      volumes:
        # --- Frigate persistent volumes ---
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: config
          emptyDir: {}
        - name: db
          emptyDir:
            sizeLimit: 5Gi
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: config-template
          configMap:
            name: frigate-config
            items:
              - key: config.yml
                path: config.yml
        # === Coral USB: the .so files mounted as files at the right basenames ===
        - name: libedgetpu
          hostPath:
            path: /lib/x86_64-linux-gnu/libedgetpu.so.1
            type: File
        - name: libusb
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libusb-1.0.so.0
            type: File
        - name: usb-dev
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: usb-sys
          hostPath:
            path: /sys/bus/usb
            type: Directory
