---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
  labels:
    app: frigate
spec:
  # Recreate strategy: with a single PVC-backed media volume, a rolling
  # update would try to mount the same PVC in two pods simultaneously.
  # Recreate is the safe choice for single-replica + RWO PVC.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      # --- Coral USB: pin to the labelled node ---
      nodeSelector:
        coral: present

      # Frigate needs root for the rtsp/simplejpeg server and the privileged
      # Coral device access. Don't try to drop to non-root.
      securityContext:
        runAsUser: 0
        runAsGroup: 0

      initContainers:
        # --- Copy the rendered config from the ConfigMap into a writable
        #     emptyDir. Frigate's ensure_dirs() needs to mkdir
        #     /config/model_cache at startup; the ConfigMap mount is
        #     read-only, which makes that fail with
        #     "OSError: [Errno 30] Read-only file system". ---
        - name: init-config
          image: docker.io/library/alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eu
              cp /config-template/config.yml /config/config.yml
              # Remove the image's default /config/config.yaml so Frigate
              # can't fall back to "name_of_your_camera" if it ever reloads.
              rm -f /config/config.yaml
              echo "init-config: config.yml staged in writable /config"
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config

      containers:
        # --- main Frigate container ---
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:0.16.1
          imagePullPolicy: IfNotPresent
          # The frigate image expects to run as root and bind privileged ports.
          securityContext:
            privileged: true
            # Coral USB char-device access — keep capabilities generous.
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_RESOURCE
                - NET_ADMIN
                - NET_RAW
                - DAC_OVERRIDE
                - DAC_READ_SEARCH
                - CHOWN
                - FOWNER
                - SETUID
                - SETGID
                - KILL
                - SYS_CHROOT
                - AUDIT_WRITE
                - AUDIT_CONTROL
                - SYS_PTRACE
                - SYS_MODULE
                - LEASE
                - WAKE_ALARM
                - BLOCK_SUSPEND
                - IPC_LOCK
                - SYS_RAWIO
                - SYS_TTY_CONFIG
                - SYS_BOOT
                - SYS_NICE
                - SYS_PACCT
                - SYSLOG
                - MKNOD
                - SETFCAP
                - NET_BIND_SERVICE
          ports:
            - name: web
              containerPort: 8971
            - name: rtsp
              containerPort: 8554
            - name: rtmp
              containerPort: 1935
          env:
            # === MQTT credentials (injected from SealedSecret) ===
            # The MQTT user is the same as the one in the mosquitto config
            # (hardcoded in the mqtt app's configmap as well), so it's
            # not a secret. The password is the only thing in the SealedSecret.
            - name: FRIGATE_MQTT_USER
              value: usermqtt
            - name: FRIGATE_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-secrets
                  key: mqtt-password
            # === Coral USB runtime ===
            # Both libedgetpu.so.1 and libusb-1.0.so.0 are bind-mounted from
            # /opt/coral-libs/ on the host, where the bookworm-compatible
            # versions live. The host's /lib and /usr/lib have Ubuntu 24.04
            # versions that need glibc 2.38 (too new for the bookworm-based
            # Frigate image).
            - name: LD_LIBRARY_PATH
              value: /usr/local/lib
            # === timezone ===
            - name: TZ
              value: Europe/Amsterdam
            # === performance / shm ===
            - name: YOLO_MODELS
              value: ""
            # --- Frigate (>=0.16) reads config path from $CONFIG_FILE ---
            - name: CONFIG_FILE
              value: /config/config.yml
            # --- Coral edgetpu library path (used by the edgetpu detector) ---
            - name: EDGETPU_SHARED_LIB
              value: /usr/local/lib/libedgetpu.so.1
          # Image is s6-overlay based; default service runs `python3 -u -m frigate`
          # with cwd=/opt/frigate. We replicate that explicitly so relative
          # paths in the bundled config resolve the same way.
          command: ["/usr/bin/python3"]
          args:
            - "-u"
            - "-m"
            - "frigate"
          workingDir: /opt/frigate

          startupProbe:
            httpGet:
              path: /api/version
              port: web
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/version
              port: web
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/version
              port: web
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "6Gi"
          # --- shared memory for inter-process communication (FFmpeg etc.) ---
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: db
              mountPath: /db
            - name: cache
              mountPath: /cache
            # === Coral USB: the 4 essential pieces ===
            - name: libedgetpu
              mountPath: /usr/local/lib/libedgetpu.so.1
              readOnly: true
            - name: libusb
              mountPath: /usr/local/lib/libusb-1.0.so.0
              readOnly: true
            - name: usb-dev
              mountPath: /dev/bus/usb
            - name: usb-sys
              mountPath: /sys/bus/usb
              readOnly: true

      volumes:
        # --- Frigate persistent volumes ---
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: config
          emptyDir: {}
        - name: config-template
          configMap:
            name: frigate-config
            items:
              - key: config.yml
                path: config.yml
        - name: db
          emptyDir:
            sizeLimit: 5Gi
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        # === Coral USB: the .so files mounted as files at the right basenames ===
        - name: libedgetpu
          hostPath:
            path: /opt/coral-libs/libedgetpu.so.1
            type: File
        - name: libusb
          hostPath:
            path: /opt/coral-libs/libusb-1.0.so.0
            type: File
        - name: usb-dev
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: usb-sys
          hostPath:
            path: /sys/bus/usb
            type: Directory
