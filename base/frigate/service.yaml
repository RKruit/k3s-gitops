---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: frigate
  labels:
    app: frigate
spec:
  type: ClusterIP
  selector:
    app: frigate
  ports:
    # The image's nginx (started by s6-overlay) serves the web UI and
    # reverse-proxies /api/* to Frigate's loopback-only FastAPI app.
    # nginx listens on TWO ports:
    #   0.0.0.0:8971  -> TLS, with the self-signed "FRIGATE DEFAULT
    #                    CERT" (intranet-only, not for k8s Service use)
    #   0.0.0.0:5000  -> plain HTTP, internal-only (go2rtc upstream,
    #                    but it also serves the UI for any plain-HTTP
    #                    client — which is what Traefik wants, since
    #                    Traefik already terminates TLS at the ingress
    #                    using the real Let's Encrypt cert from
    #                    cert-manager)
    #
    # We target port 5000 from the Service so Traefik talks plain
    # HTTP to nginx (which is the standard pattern: ingress does TLS
    # termination, backend does not).
    - name: web
      port: 8971
      targetPort: 5000
      protocol: TCP
    # go2rtc: rtsp, webrtc api. go2rtc is also started by s6.
    - name: rtsp
      port: 8554
      targetPort: 8554
      protocol: TCP
    - name: webrtc
      port: 1984
      targetPort: 1984
      protocol: TCP
    - name: go2rtc-api
      port: 11984
      targetPort: 11984
      protocol: TCP
