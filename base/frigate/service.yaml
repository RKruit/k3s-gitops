---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: frigate
  labels:
    app: frigate
spec:
  type: ClusterIP
  selector:
    app: frigate
  ports:
    # The image's nginx (started by s6-overlay) serves the web UI and
    # reverse-proxies /api/* to Frigate's loopback-only FastAPI app.
    # nginx listens on 0.0.0.0:8971 (external, with built-in auth
    # disabled — we use Traefik BasicAuth in front). Service port
    # 8971 forwards to container port 8971.
    - name: web
      port: 8971
      targetPort: web
      protocol: TCP
    # go2rtc: rtsp, webrtc api. go2rtc is also started by s6.
    - name: rtsp
      port: 8554
      targetPort: 8554
      protocol: TCP
    - name: webrtc
      port: 1984
      targetPort: 1984
      protocol: TCP
    - name: go2rtc-api
      port: 11984
      targetPort: 11984
      protocol: TCP
