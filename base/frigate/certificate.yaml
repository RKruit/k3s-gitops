---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frigate-tls
  namespace: frigate
  labels:
    app: frigate
spec:
  secretName: frigate-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - frigate.oostrandpark.com
  usages:
    - digital signature
    - key encipherment
