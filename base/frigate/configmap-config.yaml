apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: frigate
  labels:
    app: frigate
data:
  # Frigate configuration
  # https://docs.frigate.video/configuration/
  config.yml: |
    mqtt:
      enabled: True
      host: mqtt.mqtt.svc.cluster.local
      port: 1883
      topic_prefix: frigate
      client_id: frigate
      user: usermqtt
      # password is set via FRIGATE_MQTT_PASSWORD env var (substituted below)
      password: "${FRIGATE_MQTT_PASSWORD}"
      stats_interval: 60

    database:
      path: /db/cache.db

    # Coral USB Accelerator (Google Edge TPU)
    detectors:
      coral:
        type: edgetpu
        device: usb

    # Model that runs on the Coral
    model:
      width: 320
      height: 320
      input_tensor: nhwc
      input_pixel_range: [0, 1]
      path: /cpu_model.tflite
      labelmap_path: /cpu_labelmap.txt

    # FFmpeg/stream defaults
    ffmpeg:
      global_args: -hide_banner -loglevel warning
      hwaccel_args:
        - -c:v
        - h264_v4l2m2m
        - -num_capture_buffers
        - "40"
      input_args:
        - -avoid_negative_ts
        - make_zero
        - -fflags
        - nobuffer
        - -flags
        - low_delay
        - -stimeout
        - "5000000"
        - -timeout
        - "5000000"
        - -r
        - "10"
        - -f
        - mpjpeg
        - -i
        - http://127.0.0.1:8081/video.mjpg
      output_args:
        - -f
        - null
        - -codec
        - copy
        - -bsf:v
        - "null"
        - -

    # Motion / object detection tuning
    motion:
      threshold: 25
      contour_area: 100
      delta_alpha: 0.2
      frame_alpha: 0.2
      frame_height: 100
      mask: []

    # Bird's-eye view of cameras (drawn from camera zones)
    birdseye:
      enabled: True
      mode: objects
      quality: 8

    # Auth for the web UI
    auth:
      enabled: True
    # admin password is hashed via FRIGATE_ADMIN_HASH env var substitution at startup.
    # The auth.password_hash must be set in the rendered config — we patch the
    # template with a sed in initContainer (see deployment.yaml).

    # Live view
    live:
      height: 720
      quality: 8

    # Recordings (continuous, 24/7)
    record:
      enabled: True
      retain:
        days: 7
        mode: motion
      events:
        retain:
          default: 14
          mode: active_objects

    # Snapshots
    snapshots:
      enabled: True
      retain:
        default: 14

    # A representative placeholder camera — Robert will replace with real
    # RTSP/MJPEG URLs in his own time. Defining one keeps the UI from
    # crashing on first boot and gives a working "add camera" reference.
    cameras:
      front_door:
        enabled: True
        ffmpeg:
          inputs:
            - path: rtsp://admin:changeme@192.168.1.100:554/stream1
              roles:
                - detect
                - record
                - rtmp
        detect:
          width: 1280
          height: 720
          fps: 5
        objects:
          track:
            - person
            - car
          filters:
            person:
              min_area: 5000
              max_area: 100000
        motion:
          # Comma-separated polygon vertices "x1,y1,x2,y2,..."
          mask:
            - 0,0,0,100,1280,0,1280,100
        zones:
          porch:
            coordinates: 100,100,500,100,500,720,100,720
            objects:
              - person

    # RTMP restream server (consumed by other apps if needed)
    rtmp:
      enabled: False

    # Web UI runs on 8971, RTSP restream on 8554 by default
    ui:
      use_experimental: False
