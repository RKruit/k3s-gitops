---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: frigate
data:
  # Frigate 0.16.x config — schema-validated.
  # Source of truth rendered into /config/config.yml in the Frigate pod.
  # The {VAR} placeholders in EnvString-typed fields (user, password)
  # are substituted from os.environ at parse time per
  # frigate/config/env.py:validate_env_string.
  # We set FRIGATE_MQTT_USER and FRIGATE_MQTT_PASSWORD in the deployment.
  # Reference: https://github.com/blakeblackshear/frigate/blob/v0.16.1/frigate/config/config.py
  config.yml: |
    mqtt:
      enabled: True
      host: mqtt.mqtt.svc.cluster.local
      port: 1883
      user: "{FRIGATE_MQTT_USER}"
      password: "{FRIGATE_MQTT_PASSWORD}"
      topic_prefix: frigate
      client_id: frigate

    # Coral USB Accelerator for object detection
    detectors:
      coral:
        type: edgetpu
        device: usb

    # SSD MobileNet v1 from the Frigate image (baked into /)
    model:
      width: 320
      height: 320
      model_type: ssd
      path: /cpu_model.tflite
      labelmap_path: /cpu_labelmap.txt

    # Motion / object detection tuning
    motion:
      threshold: 25
      contour_area: 100
      delta_alpha: 0.2
      frame_alpha: 0.2
      frame_height: 100
      mask: []

    # Auth: built-in auth is disabled because Frigate 0.16 does not let
    # you set the admin password from config (always random token_hex).
    # We protect the UI with Traefik BasicAuth (see ingress.yaml).
    auth:
      enabled: False

    # Bird's-eye view of cameras
    birdseye:
      enabled: True
      mode: objects
      quality: 8

    # Live view quality
    live:
      quality: 8

    # Snapshots (saved on each event)
    snapshots:
      enabled: True
      retain:
        default: 14

    # Recordings (saved on each event)
    record:
      enabled: True
      retain:
        days: 14
        mode: motion
      detections:
        pre_capture: 5
        post_capture: 5
        retain:
          default: 14
          mode: active_objects
      alerts:
        pre_capture: 5
        post_capture: 5
        retain:
          default: 14
          mode: active_objects

    # Placeholder camera. Real RTSP URL must be configured by Robert
    # after the stack is up. With the placeholder unreachable, Frigate
    # still starts cleanly and exposes its UI / config / event screen.
    cameras:
      front_door:
        enabled: True
        ffmpeg:
          inputs:
            - path: rtsp://admin:changeme@192.168.1.100:554/stream1
              roles:
                - detect
                - record
        detect:
          width: 1280
          height: 720
          fps: 5
        motion:
          # Comma-separated polygon vertices "x1,y1,x2,y2,..."
          mask:
            - 0,0,0,100,1280,0,1280,100
        zones:
          porch:
            coordinates: 100,100,500,100,500,720,100,720
            objects:
              - person
