apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: hermes-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-webui
  template:
    metadata:
      labels:
        app: hermes-webui
    spec:
      containers:
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          env:
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: "/home/hermeswebui/.hermes/webui"
            - name: WANTED_UID
              value: "1000"
            - name: WANTED_GID
              value: "1000"
            - name: HERMES_WEBUI_SECURE
              value: "0"
            - name: HERMES_SKIP_CHMOD
              value: "1"
            - name: HERMES_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-webui-secret
                  key: HERMES_WEBUI_PASSWORD
          ports:
            - containerPort: 8787
              name: http
          volumeMounts:
            - name: hermes-home
              mountPath: /home/hermeswebui/.hermes
            - name: workspace
              mountPath: /workspace
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: hermes-home
          hostPath:
            path: /home/rkruit/.hermes
            type: Directory
        - name: workspace
          hostPath:
            path: /home/rkruit/workspace
            type: DirectoryOrCreate